[project]
name = "lung-nodule-detection-luna16"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lewisnjue", email = "njue.prime@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "diskcache>=5.6.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "simpleitk>=2.5.8",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[project.scripts]
